<!-- Toast Container -->
<div class="fixed top-4 right-4 z-50 space-y-4 max-w-md">
  <div
    *ngFor="let toast of toasts$ | async"
    [class]="getColorClasses(toast.type)"
    class="flex items-start p-4 rounded-lg border-l-4 shadow-lg animate-slide-in-right"
  >
    <!-- Icon -->
    <div [class]="getIconColorClasses(toast.type)" class="flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="getIcon(toast.type)" />
      </svg>
    </div>

    <!-- Content -->
    <div class="ml-3 flex-1">
      <p class="text-sm font-semibold">{{ toast.title }}</p>
      <p class="mt-1 text-sm opacity-90">{{ toast.message }}</p>
    </div>

    <!-- Close Button -->
    <button
      (click)="remove(toast.id)"
      class="ml-4 flex-shrink-0 inline-flex text-gray-400 hover:text-gray-600 focus:outline-none transition-colors"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
</div>
