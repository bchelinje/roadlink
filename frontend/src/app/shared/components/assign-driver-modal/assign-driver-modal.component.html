<!-- Modal Overlay -->
<div *ngIf="isOpen" class="fixed inset-0 z-50 overflow-y-auto" (click)="close()">
  <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:p-0">
    <!-- Background overlay -->
    <div class="fixed inset-0 transition-opacity bg-gray-500 bg-opacity-75"></div>

    <!-- Modal panel -->
    <div class="relative inline-block w-full max-w-3xl overflow-hidden text-left align-middle transition-all transform bg-white rounded-lg shadow-xl" (click)="$event.stopPropagation()">
      <!-- Modal Header -->
      <div class="bg-primary-600 px-6 py-4">
        <div class="flex items-center justify-between">
          <h3 class="text-lg font-semibold text-white">Assign Driver to Job</h3>
          <button (click)="close()" class="text-white hover:text-gray-200 focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Modal Body -->
      <div class="px-6 py-4 max-h-[70vh] overflow-y-auto">
        <!-- Error Message -->
        <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-lg mb-4">
          {{ errorMessage }}
        </div>

        <!-- Search Bar -->
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-2">Search Drivers</label>
          <input
            type="text"
            [(ngModel)]="searchTerm"
            (ngModelChange)="onSearchChange()"
            placeholder="Search by name, email, or phone..."
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
          />
        </div>

        <!-- Loading State -->
        <div *ngIf="isLoading" class="flex justify-center items-center py-12">
          <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary-600"></div>
        </div>

        <!-- Driver List -->
        <div *ngIf="!isLoading" class="space-y-3">
          <div *ngIf="filteredDrivers.length === 0" class="text-center py-8 text-gray-500">
            No drivers found matching your search.
          </div>

          <div
            *ngFor="let driver of filteredDrivers"
            (click)="selectDriver(driver.id!)"
            [class]="'border rounded-lg p-4 cursor-pointer transition-colors ' +
                     (selectedDriverId === driver.id ? 'border-primary-500 bg-primary-50' : 'border-gray-300 hover:border-primary-300')"
          >
            <div class="flex items-start justify-between">
              <div class="flex-1">
                <div class="flex items-center gap-3 mb-2">
                  <h4 class="text-lg font-semibold text-gray-900">{{ getDriverFullName(driver) }}</h4>
                  <span *ngIf="driver.status" [class]="'px-2 py-1 text-xs font-semibold rounded-full ' + (driver.status === 'active' ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800')">
                    {{ driver.status }}
                  </span>
                </div>

                <div class="grid grid-cols-2 gap-3 text-sm">
                  <div>
                    <span class="text-gray-500">Email:</span>
                    <span class="ml-2 text-gray-900">{{ driver.email }}</span>
                  </div>
                  <div>
                    <span class="text-gray-500">Phone:</span>
                    <span class="ml-2 text-gray-900">{{ driver.phone }}</span>
                  </div>
                  <div>
                    <span class="text-gray-500">Vehicle:</span>
                    <span class="ml-2 text-gray-900">{{ getDriverVehicle(driver) }}</span>
                  </div>
                  <div *ngIf="driver.rating">
                    <span class="text-gray-500">Rating:</span>
                    <span class="ml-2 text-gray-900">{{ driver.rating }}/5.0</span>
                  </div>
                </div>

                <div *ngIf="driver.address" class="mt-2 text-sm">
                  <span class="text-gray-500">Address:</span>
                  <span class="ml-2 text-gray-900">{{ driver.address }}</span>
                </div>
              </div>

              <!-- Selection Indicator -->
              <div *ngIf="selectedDriverId === driver.id" class="ml-4">
                <svg class="w-6 h-6 text-primary-600" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
              </div>
            </div>
          </div>
        </div>

        <!-- Internal Notes -->
        <div class="mt-6">
          <label class="block text-sm font-medium text-gray-700 mb-2">Internal Notes (Optional)</label>
          <textarea
            [(ngModel)]="internalNotes"
            rows="3"
            placeholder="Add any internal notes about this assignment..."
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
          ></textarea>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="bg-gray-50 px-6 py-4 flex justify-end gap-3">
        <button
          (click)="close()"
          [disabled]="isAssigning"
          class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 disabled:opacity-50"
        >
          Cancel
        </button>
        <button
          (click)="assignDriver()"
          [disabled]="!selectedDriverId || isAssigning"
          class="px-6 py-2 text-sm font-medium text-white bg-primary-600 rounded-lg hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <span *ngIf="!isAssigning">Assign Driver</span>
          <span *ngIf="isAssigning" class="flex items-center">
            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Assigning...
          </span>
        </button>
      </div>
    </div>
  </div>
</div>
