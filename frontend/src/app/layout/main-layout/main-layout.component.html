<!-- layouts/main-layout/main-layout.component.html -->
<div class="min-h-screen bg-gray-50 flex">

  <!-- Sidebar -->
  <aside
    [class.translate-x-0]="sidebarOpen"
    [class.-translate-x-full]="!sidebarOpen"
    class="fixed inset-y-0 left-0 z-50 w-64 bg-gradient-to-b from-primary-900 to-primary-950 transform transition-transform duration-300 ease-in-out lg:translate-x-0 lg:relative lg:flex lg:flex-col"
  >
    <!-- Logo/Brand -->
    <div class="flex items-center justify-between h-16 px-6 bg-primary-900/50 border-b border-primary-800">
      <div class="flex items-center space-x-3">
        <img src="/logo.png" alt="LoadLink Logo" class="h-10 w-auto" />
        <span class="text-xl font-bold text-white">LoadLink</span>
      </div>
      <button
        (click)="toggleSidebar()"
        class="lg:hidden text-gray-400 hover:text-white"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- User Profile Section -->
    <div class="px-6 py-4 border-b border-primary-800">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-gradient-to-br from-primary-600 to-primary-800 rounded-full flex items-center justify-center text-white font-semibold">
          {{ getUserInitials() }}
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium text-white truncate">{{ userName }}</p>
          <p class="text-xs text-gray-400 truncate">{{ userEmail }}</p>
        </div>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-4 py-4 space-y-1 overflow-y-auto">
      <div *ngFor="let item of navItems">
        <!-- Main nav item without children -->
        <a
          *ngIf="!item.children || item.children.length === 0"
          [routerLink]="item.route"
          routerLinkActive="bg-gradient-to-r from-primary-600 to-primary-700 text-white shadow-lg shadow-primary-500/30"
          [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
          class="group flex items-center px-3 py-2.5 text-sm font-medium rounded-lg text-gray-300 hover:bg-primary-800/50 hover:text-white transition-all duration-200"
        >
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" [innerHTML]="getIcon(item.icon)"></svg>
          <span class="flex-1">{{ item.label }}</span>
          <span *ngIf="item.badge && item.badge > 0" class="ml-auto bg-red-500 text-white text-xs font-bold px-2 py-0.5 rounded-full">
            {{ item.badge }}
          </span>
        </a>

        <!-- Main nav item with children -->
        <div *ngIf="item.children && item.children.length > 0">
          <button
            (click)="toggleSubmenu(item.label)"
            class="w-full group flex items-center px-3 py-2.5 text-sm font-medium rounded-lg text-gray-300 hover:bg-primary-800/50 hover:text-white transition-all duration-200"
          >
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" [innerHTML]="getIcon(item.icon)"></svg>
            <span class="flex-1 text-left">{{ item.label }}</span>
            <svg
              class="w-4 h-4 transition-transform duration-200"
              [class.rotate-180]="expandedMenus.has(item.label)"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </button>

          <!-- Submenu -->
          <div
            *ngIf="expandedMenus.has(item.label)"
            class="ml-8 mt-1 space-y-1 border-l-2 border-primary-700 pl-4"
          >
            <a
              *ngFor="let child of item.children"
              [routerLink]="child.route"
              routerLinkActive="text-primary-400 font-medium"
              class="group flex items-center px-3 py-2 text-sm rounded-lg text-gray-400 hover:text-white transition-all duration-200"
            >
              <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" [innerHTML]="getIcon(child.icon)"></svg>
              <span>{{ child.label }}</span>
            </a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Logout Button -->
    <div class="p-4 border-t border-primary-800">
      <button
        (click)="logout()"
        class="w-full flex items-center px-3 py-2.5 text-sm font-medium rounded-lg text-gray-300 hover:bg-red-500/20 hover:text-red-400 transition-all duration-200"
      >
        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col min-w-0">
    <!-- Top Bar (Mobile & Desktop) -->
    <header class="sticky top-0 z-40 flex h-16 items-center gap-x-4 border-b border-gray-200 bg-white px-4 shadow-sm">
      <button
        (click)="toggleSidebar()"
        class="lg:hidden text-gray-500 hover:text-gray-700"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <h1 class="flex-1 text-lg font-semibold text-gray-900">{{ pageTitle }}</h1>

      <!-- Notifications Bell -->
      <app-notifications-bell></app-notifications-bell>
    </header>

    <!-- Page Content -->
    <main class="flex-1 overflow-auto">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Sidebar Overlay (Mobile) -->
  <div
    *ngIf="sidebarOpen"
    (click)="toggleSidebar()"
    class="fixed inset-0 z-40 bg-gray-900/50 lg:hidden backdrop-blur-sm"
  ></div>
</div>
